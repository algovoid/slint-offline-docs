name: fetch-zip-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specify the tag to fetch (leave empty to auto-detect latest)"
        required: false
        default: ""
  schedule:
    - cron: "0 0 */14 * *"
env:
  SLINT_ORG: "slint-ui"
  SLINT_MASTER_REPO: "slint-ui/slint"
  SLINT_DOCS_REPO: "www-releases"
  TARGET_FOLDER_BASE: "slintOfflineDocs"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      #--------------------------------------------------------------------
      - name: Determine release tag
        id: get_tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using provided tag: $TAG"
          else
            echo "Fetching latest release tag from $SLINT_MASTER_REPO..."
            TAG=$(curl -s "https://api.github.com/repos/${SLINT_MASTER_REPO}/releases/latest" | jq -r .tag_name)
            echo "Using latest tag: $TAG"
          fi

          # Export tag to env
          echo "SLINT_TAG=$TAG" >> $GITHUB_ENV
      #--------------------------------------------------------------------
      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.SLINT_TAG }}"
          echo "Checking if release $TAG already exists..."

          exists=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
                        | jq -r '.id // empty')

          if [ -n "$exists" ]; then
            echo "Release with tag $TAG already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No existing release found for $TAG."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      #--------------------------------------------------------------------
      - name: Stop message if release already exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Stopping workflow — release already published."
      #--------------------------------------------------------------------
      - name: Create target folder
        if: steps.check_release.outputs.exists != 'true'
        run: |
          TARGET="${TARGET_FOLDER_BASE}_${SLINT_TAG}"
          mkdir -p "$TARGET"
          echo "TARGET_FOLDER=$TARGET" >> $GITHUB_ENV
      #--------------------------------------------------------------------
      - name: Recursively download folder using GitHub API
        if: steps.check_release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # (same recursive download code here)
      #--------------------------------------------------------------------
      - name: Zip the target folder
        if: steps.check_release.outputs.exists != 'true'
        run: |
          ZIP_FILE="${TARGET_FOLDER}.zip"
          cd "${TARGET_FOLDER}"
          zip -r "../${ZIP_FILE}" .
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
      #--------------------------------------------------------------------
      - name: Upload artifact
        if: steps.check_release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_FILE }}
          path: ${{ github.workspace }}/${{ env.ZIP_FILE }}
          if-no-files-found: error
      #--------------------------------------------------------------------
      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SLINT_TAG }}
          files: ${{ github.workspace }}/${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
